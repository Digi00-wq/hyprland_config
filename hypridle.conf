general {
    lock_cmd = pidof hyprlock || hyprlock       # Befehl zum Sperren
    before_sleep_cmd = loginctl lock-session    # Sperren bevor der PC schläft
    after_sleep_cmd = hyprctl dispatch dpms on  # Bildschirm an nach dem Aufwachen
}

# 1. Aktion: Sperren nach 2 Minuten (120 Sekunden)
listener {
    timeout = 120
    on-timeout = loginctl lock-session          # Aktiviert hyprlock
}

# 2. Aktion: Bildschirm aus nach einer weiteren Minute (insgesamt 180 Sekunden)
listener {
    timeout = 180
    on-timeout = hyprctl dispatch dpms off       # Schaltet den Monitor aus
    on-resume = hyprctl dispatch dpms on         # Schaltet ihn bei Bewegung wieder an
}
