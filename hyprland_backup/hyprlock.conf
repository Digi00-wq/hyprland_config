general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/tokyo-night-sddm/Backgrounds/win11.png   # Trage hier dein Bild ein
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2 # 0 ist aus, 2-3 sieht edel aus
    blur_size = 7
}


input-field { 
    monitor = DP-2
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(122, 162, 247, 1.0) # ToPyo Night Blau
    inner_color = rgba(26, 27, 38, 0.5)
    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    placeholder_text = Enter Passowrd
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(187, 154, 247, 1.0) # Tokyo Night Lila
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Hallo, Diego
    color = rgba(192, 202, 245, 1.0)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}
