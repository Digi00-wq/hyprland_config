# --- conf/input.conf ---

input {
    kb_layout = ch, us

    kb_variant = ,dvp

    kb_model =
 
    # Setzt den Shortcut zum Wechseln der Layouts auf Alt + Leertaste
    kb_options = grp:alt_space_toggle
 
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}
